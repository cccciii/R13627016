<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CRR 選擇權評價模型｜16陳</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#203047;font-family:system-ui,'Microsoft JhengHei',sans-serif}main{max-width:1200px;margin:32px auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #dce4ee;margin-bottom:24px}h1{font-size:26px;margin-bottom:5px}header p{color:#64748b;margin-top:0}.student{font-size:20px;font-weight:bold;color:#255b91;white-space:nowrap}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:22px}section,aside{background:white;border:1px solid #dce4ee;border-radius:12px;padding:20px;margin-bottom:18px}h2{font-size:17px;margin:0 0 18px}label{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:12px 0;gap:8px}input,select{width:105px;padding:8px;border:1px solid #c5d0df;border-radius:5px;background:white;color:inherit;font:inherit}button{border:0;border-radius:6px;padding:12px 9px;cursor:pointer;font-weight:bold;font-size:14px;background:#2869a5;color:white}button.secondary{background:#e7eff8;color:#255b91}.buttons{display:flex;gap:8px;margin-top:18px}.buttons button{flex:1}.result{border-top:1px solid #dce4ee;margin-top:20px;padding-top:15px;color:#536579;font-size:14px}output{display:block;font-size:30px;color:#16598d;font-weight:bold;margin-top:5px;font-variant-numeric:tabular-nums}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}th,td{border:1px solid #dce4ee;padding:10px;text-align:right;white-space:nowrap}th{background:#edf3f9;color:#41556b}td.empty{background:#f8fafc}td.root{background:#dcecfb;font-weight:bold;color:#15558a}small,.note{color:#64748b;font-size:12px;line-height:1.6}#error{color:#b42318;font-size:13px;white-space:pre-wrap}#params{font-size:13px;color:#536579;margin-bottom:14px;line-height:1.8}@media(max-width:760px){.layout{grid-template-columns:1fr}header{gap:12px}h1{font-size:21px}main{margin:16px auto;padding:0 12px}}
</style></head><body><main><header><div><h1>CRR 二元樹選擇權評價模型</h1><p>Cox–Ross–Rubinstein Binomial Tree Model</p></div><div class="student">16陳</div></header><div class="layout"><aside><h2>輸入參數</h2><form id="form"><label>現貨價格 Spot<input id="spot" type="number" step="any" value="70" required></label><label>履約價格 K<input id="strike" type="number" step="any" value="80" required></label><label>到期期間 T (年)<input id="time" type="number" step="any" value="1" required></label><label>無風險利率 r<input id="rate" type="number" step="any" value="0.02" required></label><label>波動率 Vol<input id="vol" type="number" step="any" value="0.2" required></label><label>期數 n<input id="steps" type="number" min="1" max="200" step="1" value="5" required></label><label>選擇權 OpType<select id="op"><option value="C">C — 買權</option><option value="P" selected>P — 賣權</option></select></label><label>履約方式 ExType<select id="ex"><option value="A" selected>A — 美式</option><option value="E">E — 歐式</option></select></label><small>利率、波動率採小數輸入，例如 2% = 0.02。</small><div class="buttons"><button type="button" class="secondary" onclick="ClearTree()">清除樹</button><button type="submit">計算選擇權</button></div></form><p id="error" role="alert"></p><div class="result">選擇權價值<output id="result" aria-live="polite">—</output></div></aside><div><section><h2>價格樹 Stock Price Tree</h2><div id="params"></div><div class="scroll" id="stockTree"></div></section><section><h2>選擇權樹 Option Value Tree</h2><div class="scroll" id="optionTree"></div><p class="note">每欄代表一期，從上到下依序為下跌次數 0、1、2…；美式選擇權於每一節點比較立即履約價值與持有價值。</p></section></div></div></main><script>
'use strict';
const el = id => document.getElementById(id);
const fmt = x => Number(x.toFixed(5)).toFixed(5);
// Equivalent to the VBA ClearTree() macro. Preserve the input values.
function ClearTree(){el('stockTree').replaceChildren();el('optionTree').replaceChildren();el('params').textContent='';el('result').textContent='—';el('error').textContent='';}
function renderTree(tree, target){const n=tree.length-1;const table=document.createElement('table');const head=table.createTHead().insertRow();for(let t=0;t<=n;t++){const th=document.createElement('th');th.textContent='t = '+t;head.appendChild(th);}const body=table.createTBody();for(let j=0;j<=n;j++){const row=body.insertRow();for(let t=0;t<=n;t++){const cell=row.insertCell();if(j<=t){cell.textContent=fmt(tree[t][j]);if(t===0)cell.className='root';}else cell.className='empty';}}el(target).replaceChildren(table);}
// Equivalent to the VBA CRRTree() macro, with zero-based array indices.
function CRRTree(){ClearTree();try{const ids=['spot','strike','time','rate','vol','steps'];const [Spot,K,T,rf,vol,n]=ids.map(id=>{if(el(id).value.trim()==='')throw Error('請填寫所有參數。');return Number(el(id).value);});const OpType=el('op').value,ExType=el('ex').value;if(![Spot,K,T,rf,vol,n].every(Number.isFinite)||Spot<=0||K<=0||T<=0||vol<=0||!Number.isInteger(n)||n<1||n>200)throw Error('請輸入有效參數：Spot、K、T、Vol 必須大於 0，n 必須為 1–200 的整數。');const dt=T/n,u=Math.exp(vol*Math.sqrt(dt)),d=1/u,p=(Math.exp(rf*dt)-d)/(u-d),discount=Math.exp(-rf*dt);if(!Number.isFinite(p)||p<0||p>1)throw Error('風險中立機率 p 不在 [0,1] 內，請調整利率、波動率或期數。');const S=Array.from({length:n+1},(_,t)=>Array(t+1).fill(0));const Op=Array.from({length:n+1},(_,t)=>Array(t+1).fill(0));const payoff=s=>Math.max(OpType==='C'?s-K:K-s,0);for(let t=0;t<=n;t++)for(let j=0;j<=t;j++)S[t][j]=Spot*Math.pow(u,t-j)*Math.pow(d,j);for(let j=0;j<=n;j++)Op[n][j]=payoff(S[n][j]);for(let t=n-1;t>=0;t--)for(let j=0;j<=t;j++){const hold=discount*(p*Op[t+1][j]+(1-p)*Op[t+1][j+1]);Op[t][j]=ExType==='A'?Math.max(payoff(S[t][j]),hold):hold;}if(!S.every(a=>a.every(Number.isFinite))||!Op.every(a=>a.every(Number.isFinite)))throw Error('計算超出數值範圍，請調整參數。');renderTree(S,'stockTree');renderTree(Op,'optionTree');el('params').textContent=`Δt = ${fmt(dt)}　 u = ${fmt(u)}　 d = ${fmt(d)}　 p = ${fmt(p)}`;el('result').textContent=fmt(Op[0][0]);}catch(e){el('error').textContent=e.message;}}
el('form').addEventListener('submit',e=>{e.preventDefault();CRRTree();});CRRTree();
</script></body></html>
